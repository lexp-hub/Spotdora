[package]
name = "spotdora"
version = "0.5.1"
edition = "2021"
license = "MIT"
authors = ["lex <https://github.com/lexp-hub>"]
description = "Native GTK4/Libadwaita Spotify client heavily optimized for Fedora Workstation"
repository = "https://github.com/lexp-hub/Spotdora"
homepage = "https://github.com/lexp-hub/Spotdora"

[dependencies.gtk]
version = "^0.9"
package = "gtk4"
features = ["gnome_47", "blueprint"]

[dependencies.libadwaita]
version = "^0.7"
features = ["v1_6"]

[dependencies.gdk]
version = "^0.9"
package = "gdk4"

[dependencies.gio]
version = "^0.20"
features = []

[dependencies.glib]
version = "^0.20"
features = []

[dependencies.librespot]
version = "0.6.0"
features = ["alsa-backend", "pulseaudio-backend", "gstreamer-backend"]

[dependencies.tokio]
version = "1.38"
features = ["rt", "macros", "sync"]

[dependencies.futures]
package = "futures"
version = "0.3.30"

[dependencies.serde]
version = "^1.0.200"
features = ["derive"]

[dependencies.serde_json]
version = "^1.0.120"

[dependencies.isahc]
version = "^1.7.2"
features = ["json"]

[dependencies.rand]
version = "^0.8.5"
features = ["small_rng"]

[dependencies.gettext-rs]
version = "=0.7.0"
features = ["gettext-system"]

[dependencies.secret-service]
version = "3.0.1"
features = ["rt-async-io-crypto-rust"]

[dependencies]
gdk-pixbuf = "^0.20"
ref_filter_map = "1.0.1"
regex = "1.10.5"
async-std = "1.12.0"
form_urlencoded = "1.2.1"
zbus = "3.15.2"
zvariant = "3.15.2"
thiserror = "1.0.63"
lazy_static = "1.5.0"
log = "0.4.22"
env_logger = "0.11.5"
percent-encoding = "2.3.1"
oauth2 = "4.4.2"
url = "2.5.2"
open = "5.3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
